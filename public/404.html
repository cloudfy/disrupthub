<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Disrupt.hub</title>
    <!--
      GitHub Pages SPA redirect:
      When someone navigates directly to a deep link (e.g. /how-we-build),
      GitHub Pages returns this 404.html. We redirect them to / with the
      original path encoded in the query string, then the main index.html
      reads it back and replaces the URL via history.replaceState.

      Technique from: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
